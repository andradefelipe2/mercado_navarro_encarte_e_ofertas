<!-- CÓDIGO DO CARRINHO PULSANTE (MINIMALISTA) -->
<style>
  /* Container do carrinho fixado no canto inferior direito */
  .cart-floating-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 65px;
    height: 65px;
    z-index: 9999; /* Garante que fique por cima de outros elementos sem travar a tela */
    pointer-events: none; /* Permite clicar através do container se necessário */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .cart-floating-svg {
    width: 100%;
    height: 100%;
  }

  /* Estilo das linhas com cores quentes */
  .stroke-line-warm {
    fill: none;
    stroke: #ff4500; /* Laranja/Vermelho vibrante */
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    
    /* Animação pulsante em tons de Vermelho e Laranja */
    animation: pulseWarmGlow 1.8s infinite ease-in-out alternate;
  }

  /* Efeito de iluminação e transição de cor quente */
  @keyframes pulseWarmGlow {
    0% {
      stroke: #ff2a00; /* Vermelho puro */
      filter: drop-shadow(0 0 3px #ff2a00);
      opacity: 0.65;
    }
    50% {
      stroke: #ff7700; /* Laranja vivo */
      filter: drop-shadow(0 0 12px #ff7700);
      opacity: 1;
    }
    100% {
      stroke: #ff0055; /* Vermelho/Pink Neon */
      filter: drop-shadow(0 0 16px #ff0055);
      opacity: 0.85;
    }
  }
</style>

<div class="cart-floating-widget">
  <svg class="cart-floating-svg" viewBox="0 0 100 100">
    <!-- Pega da mão / Cabo -->
    <path class="stroke-line-warm" d="M 15 28 L 27 28" />
    
    <!-- Cesto principal -->
    <path class="stroke-line-warm" d="M 27 28 L 36 62 L 78 62 L 85 36 L 30 36" />
    
    <!-- Linhas internas minimalistas -->
    <path class="stroke-line-warm" d="M 44 36 L 48 54" />
    <path class="stroke-line-warm" d="M 58 36 L 60 54" />
    <path class="stroke-line-warm" d="M 72 36 L 70 54" />
    <path class="stroke-line-warm" d="M 33 48 L 81 48" />

    <!-- Rodas -->
    <circle class="stroke-line-warm" cx="42" cy="73" r="5" />
    <circle class="stroke-line-warm" cx="72" cy="73" r="5" />
    
    <!-- Suporte inferior -->
    <path class="stroke-line-warm" d="M 39 62 L 42 68" />
    <path class="stroke-line-warm" d="M 75 62 L 72 68" />
  </svg>
</div>
