<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercado Navarro - Encarte da Semana</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bg-navarro { background-color: #1d1740; }
    .text-navarro { color: #1d1740; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- Cabeçalho -->
  <header class="bg-navarro text-white py-4 px-6 shadow-md text-center">
    <h1 class="text-2xl font-bold tracking-wide">MERCADO NAVARRO</h1>
    <p class="text-xs text-amber-400 font-medium">Mais economia, mais qualidade!</p>
  </header>

  <!-- Container do Encarte -->
  <main class="flex-1 container mx-auto px-4 py-8 max-w-3xl">
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
      
      <div class="p-4 bg-amber-500 text-white text-center font-bold text-lg flex items-center justify-center gap-2">
        <span>🔥</span> ENCARTE DE OFERTAS DA SEMANA <span>🔥</span>
      </div>

      <!-- Área da Imagem -->
      <div class="p-4 text-center bg-gray-50 min-h-[400px] flex items-center justify-center relative">
        <img 
          id="img-encarte" 
          src="" 
          alt="Encarte de Ofertas Mercado Navarro" 
          class="w-full h-auto rounded-lg shadow-sm hidden"
          onload="this.classList.remove('hidden'); document.getElementById('loading').classList.add('hidden');"
          onerror="this.classList.add('hidden'); document.getElementById('erro-encarte').classList.remove('hidden'); document.getElementById('loading').classList.add('hidden');"
        />

        <!-- Loading -->
        <div id="loading" class="text-gray-500 text-sm animate-pulse">
          Carregando encarte atualizado...
        </div>

        <!-- Fallback de Erro / Sem imagem -->
        <div id="erro-encarte" class="hidden text-gray-500 p-8">
          <p class="text-base font-semibold">Estamos preparando as novas ofertas da semana!</p>
          <p class="text-xs mt-1">Volte em instantes para conferir as promoções.</p>
        </div>
      </div>

      <!-- Rodapé do Card -->
      <div class="p-4 bg-gray-100 text-center text-xs text-gray-600 border-t">
        <p class="font-semibold">Unidade 1: Rua Antonio Alfredo Campos, 42</p>
        <p class="font-semibold">Unidade 2: Rua São Caetano do Sul, 416</p>
      </div>

    </div>
  </main>

  <script>
    // Lógica 100% GitHub com Cache-Busting
    document.addEventListener("DOMContentLoaded", function() {
      const imgElement = document.getElementById("img-encarte");
      
      // Caminho relativo para a imagem dentro da pasta assets do GitHub
      const caminhoEncarte = "./assets/encarte.png";
      
      // Força o navegador a buscar a imagem mais recente no GitHub
      const cacheBuster = "?v=" + new Date().getTime();
      
      imgElement.src = caminhoEncarte + cacheBuster;
    });
  </script>
</body>
</html>
